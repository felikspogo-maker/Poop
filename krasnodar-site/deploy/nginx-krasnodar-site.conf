# nginx: раздаёт сайт «Мисс и Миссис Краснодарский край» из папки репозитория.
# Сейчас — по IP сервера. Когда будет домен, замените "_" на имя домена
# (например, misskrasnodar.ru www.misskrasnodar.ru) и выпустите SSL через certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/krasnodar-bot/krasnodar-site;
    index index.html;
    charset utf-8;

    # Не отдавать служебные файлы (.git, .env и т.п.) и инструкции
    location ~ /\.  { deny all; return 404; }
    location ~* \.(md|conf)$ { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Картинки и видео кэшируются браузером на 30 дней
    location ~* \.(jpe?g|png|webp|avif|gif|svg|mp4|webm|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
